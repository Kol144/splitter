name: Publish Splitter website

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build public interface
        run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: data/temp/github-pages
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
